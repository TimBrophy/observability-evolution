<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Evolution of Observability</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%;overflow:hidden;background:#0d0f14}
body{width:1280px;height:720px;overflow:hidden;position:absolute;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#0d0f14;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 100px}
.grid{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,0.03) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.bar{position:fixed;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#00BFB3 0%,#0077CC 100%)}
.glow{position:fixed;right:-200px;top:50%;transform:translateY(-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,191,179,.12) 0%,transparent 70%);pointer-events:none}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.f1{opacity:0;animation:up .6s cubic-bezier(.22,.68,0,1.2) forwards .15s}
.f2{opacity:0;animation:up .6s cubic-bezier(.22,.68,0,1.2) forwards .35s}
.f3{opacity:0;animation:up .6s cubic-bezier(.22,.68,0,1.2) forwards .55s}
.f4{opacity:0;animation:up .6s cubic-bezier(.22,.68,0,1.2) forwards .75s}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:#00BFB3;margin-bottom:28px}
h1{font-size:5rem;font-weight:900;letter-spacing:-.04em;line-height:1;margin-bottom:28px}
h1 span{color:#00BFB3}
.sub{font-size:1.2rem;font-weight:300;color:rgba(255,255,255,.5);max-width:620px;line-height:1.65;margin-bottom:48px}
.meta{display:flex;gap:32px;align-items:center}
.meta-item{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.meta-item span{color:rgba(255,255,255,.6);font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px}
</style>
</head>
<body>
<div class="grid"></div>
<div class="bar"></div>
<div class="glow"></div>
<div class="eyebrow f1">Field Engineering · Elastic Observability</div>
<h1 class="f2">The Evolution<br>of <span>Observability</span></h1>
<p class="sub f3">From reactive monitoring to AI-driven insight — how organisations are finally keeping pace with the systems they build.</p>
<div class="meta f4">
  <div class="meta-item">Session<span>Observability Foundations</span></div>
  <div class="meta-item" style="color:rgba(255,255,255,.15)">|</div>
  <div class="meta-item">Level<span>Introductory – Intermediate</span></div>
</div>
<script src="/js/fuckslides.js"></script>
<script>
(function(){if(window!==window.top)return;const W=1280,H=720;function f(){var s=Math.min(innerWidth/W,innerHeight/H);document.body.style.transform='scale('+s+')';document.body.style.transformOrigin='0 0';document.body.style.left=((innerWidth-W*s)/2)+'px';document.body.style.top=((innerHeight-H*s)/2)+'px'}f();addEventListener('resize',f)})();
</script>
</body>
</html>
